<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#021C1B" flood-opacity="0.45" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#021C1B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="180" r="180" fill="#14B8A6" opacity="0.25" />

  <!-- Main Ledger Book / Khata -->
  <g filter="url(#dropShadow)">
    <!-- Back Cover (Teal accent leather rim) -->
    <rect x="110" y="96" width="292" height="328" rx="28" fill="#115E59" />

    <!-- Ledger Pages Block (Pure White Paper) -->
    <rect x="122" y="104" width="270" height="312" rx="22" fill="#FFFFFF" />

    <!-- Top Header Banner (Brand Teal Spine Band) -->
    <path d="M 122 126 C 122 113.8 131.8 104 144 104 L 370 104 C 382.2 104 392 113.8 392 126 L 392 168 L 122 168 Z" fill="#0F766E" />

    <!-- Spine Stitching / Decorative Dots on Spine -->
    <circle cx="152" cy="136" r="4" fill="#99F6E4" />
    <circle cx="172" cy="136" r="4" fill="#99F6E4" />
    <circle cx="192" cy="136" r="4" fill="#99F6E4" />

    <!-- Bookmark Ribbon Hanging From Top -->
    <path d="M 334 104 L 334 204 L 348 190 L 362 204 L 362 104 Z" fill="url(#goldGrad)" />

    <!-- Ledger Ruling Lines -->
    <rect x="156" y="200" width="130" height="10" rx="5" fill="#0D9488" opacity="0.85" />
    <rect x="156" y="228" width="156" height="8" rx="4" fill="#CBD5E1" />
    <rect x="156" y="252" width="140" height="8" rx="4" fill="#CBD5E1" />
    <rect x="156" y="276" width="124" height="8" rx="4" fill="#CBD5E1" />

    <!-- Graduation Cap Icon in Center / Academic Mastery -->
    <g transform="translate(186, 310)">
      <!-- Cap Diamond -->
      <polygon points="46,0 92,18 46,36 0,18" fill="#0F766E" />
      <!-- Skull cap underside -->
      <path d="M 20 26 L 20 42 C 20 54 72 54 72 42 L 72 26" fill="#134E4A" />
      <!-- Tassel -->
      <path d="M 78 24 L 88 38 L 84 50" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" />
      <circle cx="84" cy="52" r="3" fill="#D97706" />
      <circle cx="46" cy="18" r="4" fill="#FDE047" />
    </g>

    <!-- Bottom Right Stamp / Tuition Currency Badge -->
    <g filter="url(#badgeShadow)">
      <circle cx="344" cy="350" r="46" fill="url(#goldGrad)" />
      <circle cx="344" cy="350" r="38" fill="#0F766E" />
      <!-- Stylized Taka / Currency Glyph "৳" / Checkmark -->
      <!-- Checkmark & Pen Tip Symbol -->
      <path d="M 330 350 L 340 360 L 360 338" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
